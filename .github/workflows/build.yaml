#### FILE: .github/workflows/build.yaml
name: Build Zork-GB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ROM
        uses: addnab/docker-run-action@v3
        with:
          # Using the verified z98/gbdk-2020 image which is generally more accessible
          image: z98/gbdk-2020:latest
          options: -v ${{ github.workspace }}:/src
          run: |
            cd /src
            make clean
            make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zork-gb-rom
          path: zork_gb.gb
          