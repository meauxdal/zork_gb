#### FILE: .github/workflows/build.yaml
name: Build Zork-GB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install GBDK-2020
        run: |
          wget https://github.com/gbdk-2020/gbdk-2020/releases/download/4.2.0/gbdk-linux64.tar.gz
          tar -xzf gbdk-linux64.tar.gz

      - name: Build ROM
        env:
          GBDKDIR: ${{ github.workspace }}/gbdk/
        run: |
          export PATH=$PATH:${{ github.workspace }}/gbdk/bin
          make clean
          make
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zork-gb-rom
          path: zork_gb.gb
          